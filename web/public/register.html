<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="register.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="http://localhost:3000/api/login" method="post">
        <input class="name" required placeholder="Enter your name" type="text">
        <input class="email" required placeholder="Enter your e-mail" type="email" pattern="^\S+@\S+\.\S+$">
        <input class="password" required placeholder="Enter your password" type="password">
        <button class="btn1" role="button" type="submit">register</button>
        <script src="register.mjs"></script>
    </form>
</body>
</html>
